[platformio]
default_envs = stm32-f411

[env:stm32-f411]
platform = ststm32
board = blackpill_f411ce
framework = stm32cube

upload_protocol = stlink
debug_tool = stlink

build_type = debug
debug_init_break = tbreak main

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17

lib_deps =
    symlink://../../libraries/embedded-input
    symlink://../../libraries/automotive-core
